<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>법인영업 레이더</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='1' width='14' height='14' rx='3' fill='%232447d6'/%3E%3Cpath d='M4 11l3-3 2 2 3-4' stroke='white' stroke-width='1.6' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 업무툴 셸: 사이드바 · 목록 · 상세 3단. 정보는 표로, 색은 상태에만. */
:root{
  --bg:#f3f4f6;--side:#eceef1;--panel:#fff;--panel-2:#f7f8fa;--hover:#f1f3f6;--sel:#e8edfd;
  --line:#e1e4e9;--line-2:#eceef2;--ink:#111827;--ink-2:#394150;--mute:#6b7280;--faint:#9aa1ad;
  --accent:#2447d6;--accent-ink:#fff;--accent-weak:#e8edfd;
  --hot:#c8321f;--hot-weak:#fdecea;--warm:#a75a00;--warm-weak:#fdf1e1;--ok:#0b7a43;--ok-weak:#e4f4ea;
  --c-fund:#2447d6;--c-bb:#6b46c1;--c-pl:#c2410c;--c-ul:#0f766e;--c-lp:#64748b;
  --up:#c8321f;--down:#1d5fd1;--gold:#c98a00;
  --f-ui:"Pretendard Variable","Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"Pretendard Variable","Pretendard","Malgun Gothic",system-ui,sans-serif;
  --row:34px;--r:6px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1016;--side:#0f141b;--panel:#131920;--panel-2:#171e26;--hover:#1a222c;--sel:#1b2645;
  --line:#232b36;--line-2:#1c232d;--ink:#e5e8ee;--ink-2:#b2b9c5;--mute:#808999;--faint:#5c6575;
  --accent:#7d95ff;--accent-ink:#0c1016;--accent-weak:#1b2645;
  --hot:#f2735f;--hot-weak:#3a1a16;--warm:#f0a73a;--warm-weak:#33250f;--ok:#4cc38a;--ok-weak:#12291e;
  --c-fund:#7d95ff;--c-bb:#a98bf0;--c-pl:#f08a4b;--c-ul:#3fbfb0;--c-lp:#94a3b8;--up:#f2735f;--down:#6ea2ff;--gold:#f0c040;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1016;--side:#0f141b;--panel:#131920;--panel-2:#171e26;--hover:#1a222c;--sel:#1b2645;
  --line:#232b36;--line-2:#1c232d;--ink:#e5e8ee;--ink-2:#b2b9c5;--mute:#808999;--faint:#5c6575;
  --accent:#7d95ff;--accent-ink:#0c1016;--accent-weak:#1b2645;
  --hot:#f2735f;--hot-weak:#3a1a16;--warm:#f0a73a;--warm-weak:#33250f;--ok:#4cc38a;--ok-weak:#12291e;
  --c-fund:#7d95ff;--c-bb:#a98bf0;--c-pl:#f08a4b;--c-ul:#3fbfb0;--c-lp:#94a3b8;--up:#f2735f;--down:#6ea2ff;--gold:#f0c040;color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.45 var(--f-ui);letter-spacing:-.005em;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
[hidden]{display:none!important}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}.faint{color:var(--faint)}.gold{color:var(--gold)}
svg.i{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* 로그인 */
.gate{min-height:100%;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.gate form{width:100%;max-width:340px;display:grid;gap:10px}
.gate .mark{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin-bottom:14px}
.gate .mark b{width:20px;height:20px;border-radius:5px;background:var(--accent);display:grid;place-items:center}
.gate label.f{display:grid;gap:4px;font-size:12px;color:var(--mute)}
.gate input[type=text],.gate input[type=password]{height:38px;padding:0 11px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);font-size:14px}
.gate .chk{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ink-2)}
.gate button{height:38px;border:0;border-radius:var(--r);background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer;margin-top:4px}
.gate .err{color:var(--hot);font-size:12px;min-height:16px}
.gate .foot{margin-top:18px;font-size:11px;color:var(--faint);line-height:1.6}

/* 셸 */
.app{height:100%;display:grid;grid-template-columns:208px minmax(0,1fr)}
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding:12px 8px calc(10px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:8px;padding:2px 8px 12px;font-weight:700;font-size:14px}
.brand b{width:18px;height:18px;border-radius:4px;background:var(--accent);display:grid;place-items:center}
.brand b svg{width:12px;height:12px;stroke:#fff;stroke-width:2}
.find{display:flex;align-items:center;gap:8px;height:30px;margin:0 2px 10px;padding:0 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);color:var(--mute);cursor:pointer;font-size:12px}
.find kbd{margin-left:auto}
kbd{font:11px var(--f-num);padding:1px 5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;background:var(--panel);color:var(--mute)}
.nav{display:flex;flex-direction:column;gap:1px}
.nav a{display:flex;align-items:center;gap:9px;height:30px;padding:0 8px;border-radius:var(--r);color:var(--ink-2);text-decoration:none}
.nav a:hover{background:var(--hover)}
.nav a.on{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.nav a .n{margin-left:auto;font-size:11px;color:var(--mute)}
.nav a .n.hot{color:var(--hot);font-weight:600}
.nav .sep{height:1px;background:var(--line);margin:8px 6px}
.fresh{margin-top:auto;padding:10px 8px 8px;border-top:1px solid var(--line);display:grid;gap:5px;font-size:11px}
.fresh .h{color:var(--mute);text-transform:uppercase;letter-spacing:.06em;font-size:10px;margin-bottom:2px}
.fresh div{display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.fresh i{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none}
.fresh i.w{background:var(--warm)}.fresh i.h{background:var(--hot)}
.fresh .d{margin-left:auto;color:var(--mute)}
.me{display:flex;align-items:center;gap:4px;padding:8px 6px 0;font-size:12px;color:var(--ink-2)}
.me span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:28px;height:28px;display:grid;place-items:center;border:0;background:none;border-radius:var(--r);color:var(--mute);cursor:pointer}
.ib:hover{background:var(--hover);color:var(--ink)}

.main{display:grid;grid-template-rows:auto minmax(0,1fr);min-width:0;min-height:0}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);min-height:50px}
.bar h1{font-size:15px;margin:0;font-weight:700;white-space:nowrap}
.bar .meta{color:var(--mute);font-size:12px;min-width:0}
.bar .sp{flex:1}
.work{display:grid;grid-template-columns:minmax(0,1fr) 400px;min-height:0}
.work.wide{grid-template-columns:minmax(0,1fr)}
.work.wide .detail{display:none}
.pane{overflow:auto;min-height:0;min-width:0}
.detail{border-left:1px solid var(--line);background:var(--panel);overflow:auto;min-height:0}

/* 컨트롤 */
.seg{display:inline-flex;height:28px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden}
.seg button{border:0;background:none;padding:0 10px;cursor:pointer;color:var(--ink-2);font-size:12px;white-space:nowrap;border-right:1px solid var(--line-2)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--panel);font-weight:600}
.sel,.txt{height:28px;padding:0 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);font-size:12px}
.txt{width:170px}
.btn{height:28px;display:inline-flex;align-items:center;gap:6px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);cursor:pointer;font-size:12px;color:var(--ink-2);white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--hover);color:var(--ink);text-decoration:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border:1px solid var(--line);border-radius:12px;background:var(--panel);cursor:pointer;font-size:12px;color:var(--ink-2)}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-weak);font-weight:600}
.chip .n{font-size:11px;color:inherit;opacity:.8}
.sw{width:7px;height:7px;border-radius:2px;background:var(--c);display:inline-block}

/* 표 */
table{border-collapse:separate;border-spacing:0;width:100%}
th{position:sticky;top:0;z-index:1;background:var(--panel-2);height:30px;padding:0 10px;text-align:left;font-weight:600;font-size:11px;color:var(--mute);border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--ink)}
th .ar{font-size:9px;margin-left:3px}
td{height:var(--row);padding:0 10px;border-bottom:1px solid var(--line-2);white-space:nowrap;background:var(--panel)}
th.r,td.r{text-align:right}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--hover)}
tbody tr.on td{background:var(--sel)}
td.nm{font-weight:600;max-width:220px;overflow:hidden;text-overflow:ellipsis}
td.wrap{white-space:normal;line-height:1.35;padding-block:6px;max-width:320px}
.more{display:block;margin:12px auto 24px;height:28px;padding:0 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);cursor:pointer;font-size:12px;color:var(--ink-2)}
.sub-h{display:flex;align-items:center;gap:8px;padding:14px 16px 6px;font-size:11px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.sub-h .n{color:var(--ink-2)}
.empty{padding:40px 16px;text-align:center;color:var(--mute)}
.filters{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.filters .cnt{margin-left:auto;color:var(--mute);font-size:12px}

/* 신호 표시 */
.sg{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.sg::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--c);flex:none}
.sg b{font-weight:600;color:var(--ink)}
.dd{display:inline-block;min-width:44px;padding:1px 6px;border-radius:4px;font-size:11px;font-weight:600;text-align:center;background:var(--panel-2);color:var(--ink-2);border:1px solid var(--line-2)}
.dd.hot{background:var(--hot-weak);color:var(--hot);border-color:transparent}
.dd.warm{background:var(--warm-weak);color:var(--warm);border-color:transparent}
.dd.past{color:var(--faint)}
.pill{display:inline-block;padding:0 6px;height:18px;line-height:18px;border-radius:4px;font-size:11px;font-weight:600;background:var(--panel-2);color:var(--ink-2);border:1px solid var(--line-2)}
.pill.ok{background:var(--ok-weak);color:var(--ok);border-color:transparent}
.pill.ac{background:var(--accent-weak);color:var(--accent);border-color:transparent}
.pill.hot{background:var(--hot-weak);color:var(--hot);border-color:transparent}
.new{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:2px}
.star{color:var(--faint);cursor:pointer;border:0;background:none;padding:0 2px;line-height:1}
.star.on{color:var(--gold)}
.score{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}
.score i{display:block;width:28px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.score i b{display:block;height:100%;background:var(--ink-2)}

/* 상세 */
.dh{padding:16px 18px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.dh .t{display:flex;align-items:center;gap:8px}
.dh h2{margin:0;font-size:17px;font-weight:700;text-wrap:balance}
.dh .m{margin-top:2px;color:var(--mute);font-size:12px}
.dh .back{display:none}
.dsec{padding:14px 18px;border-bottom:1px solid var(--line-2)}
.dsec h3{margin:0 0 8px;font-size:11px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:8px}
.kv{display:grid;grid-template-columns:84px minmax(0,1fr);gap:5px 10px;font-size:12px;margin:0}
.kv dt{color:var(--mute)}.kv dd{margin:0;color:var(--ink);min-width:0;overflow-wrap:anywhere}
.cp{border:0;background:none;color:var(--mute);cursor:pointer;padding:0 2px}
.cp:hover{color:var(--accent)}
.prods{display:flex;gap:4px;flex-wrap:wrap}
.rec{display:grid;gap:8px}
.rec .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rec textarea{width:100%;min-height:64px;padding:8px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);resize:vertical;font-size:12px;line-height:1.5}
.rec input[type=date]{height:28px;padding:0 6px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);font-size:12px}
.saved{font-size:11px;color:var(--ok);text-transform:none;letter-spacing:0;font-weight:500}
.sig{padding:12px 0;border-top:1px solid var(--line-2)}
.sig:first-of-type{border-top:0;padding-top:2px}
.sig .h{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.sig .h .sc{margin-left:auto;font-size:11px;color:var(--mute)}
.talk{margin-top:10px;padding:10px 12px;background:var(--panel-2);border:1px solid var(--line-2);border-radius:var(--r);white-space:pre-wrap;font-size:12.5px;line-height:1.65;color:var(--ink-2)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.calc{margin-top:8px;font-size:12px;color:var(--ink-2)}
.why{margin-top:6px;font-size:11px;color:var(--faint)}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:12px}
.tl li{display:grid;grid-template-columns:76px minmax(0,1fr);gap:8px}
.tl li span:first-child{color:var(--mute)}
.notice{padding:12px 18px 24px;font-size:11px;line-height:1.6;color:var(--faint)}
.dempty{height:100%;display:grid;place-items:center;text-align:center;color:var(--mute);padding:24px;font-size:12px;line-height:1.8}

/* 배너 */
.warnbar{padding:8px 16px;background:var(--warm-weak);color:var(--warm);font-size:12px;border-bottom:1px solid var(--line)}

/* 달력 */
.cal{padding:12px 16px 24px}
.cal .hd{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.cal .hd b{font-size:14px;min-width:70px;text-align:center}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);background:var(--panel)}
.grid7 .w{padding:6px 8px;font-size:11px;color:var(--mute);border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel-2)}
.grid7 .w.sun{color:var(--hot)}
.day{min-height:96px;padding:5px 6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;min-width:0}
.day:hover{background:var(--hover)}
.day.out{background:var(--panel-2)}.day.out .dn{color:var(--faint)}
.day.on{box-shadow:inset 0 0 0 2px var(--accent)}
.day .dn{font-size:11px;font-weight:600;color:var(--ink-2);display:flex;justify-content:space-between}
.day.today .dn b{background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:0 5px}
.day .ev{display:flex;align-items:center;gap:4px;font-size:11px;line-height:17px;overflow:hidden;white-space:nowrap;color:var(--ink-2)}
.day .ev::before{content:"";width:5px;height:5px;border-radius:1px;background:var(--c);flex:none}
.day .more2{font-size:11px;color:var(--mute)}
.day .cnt2{display:none;font-size:11px;color:var(--accent);font-weight:600}
.daylist{margin-top:14px}

/* 금리 */
.mk{padding:12px 16px 24px;display:grid;gap:14px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.box .bh{display:flex;align-items:center;gap:8px;padding:8px 12px;min-height:40px;border-bottom:1px solid var(--line-2);font-weight:600;font-size:12px}
.box .bh .mute{font-weight:400}
.mkgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px}
.box .tw{overflow-x:auto}
.chart{position:relative;height:250px;padding:6px 8px 0}
.chart svg{width:100%;height:100%;display:block}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;font-size:11px;box-shadow:0 6px 18px rgba(0,0,0,.12);white-space:nowrap}
.legend{display:flex;gap:12px;flex-wrap:wrap;padding:0 12px 10px;font-size:11px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:2px;margin-right:5px;vertical-align:3px}
.calcf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:12px}
.calcf label{display:grid;gap:4px;font-size:11px;color:var(--mute)}
.calcf input,.calcf select{height:30px;padding:0 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);min-width:0}
.calcr{padding:0 12px 12px;font-size:12px;color:var(--ink-2);line-height:1.7}
.calcr b{font-size:16px;color:var(--ink)}
.idx{display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.idx>div{padding:10px 12px;border-right:1px solid var(--line-2)}
.idx>div:last-child{border-right:0}
.idx .l{font-size:11px;color:var(--mute)}.idx .v{font-size:15px;font-weight:600}
.up{color:var(--up)}.down{color:var(--down)}
.spark{display:block}

/* 팔레트·토스트 */
.pal{position:fixed;inset:0;z-index:50;background:rgba(8,12,18,.35);display:flex;justify-content:center;align-items:flex-start;padding:12vh max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.pal .w{width:100%;max-width:560px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.25);overflow:hidden}
.pal input{width:100%;height:46px;padding:0 16px;border:0;border-bottom:1px solid var(--line);background:none;font-size:15px;outline:none}
.pal .rs{max-height:52vh;overflow:auto;padding:6px}
.pal .it{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:var(--r);cursor:pointer}
.pal .it.on{background:var(--sel)}
.pal .it .k{margin-left:auto;font-size:11px;color:var(--mute)}
.pal .gh{padding:8px 10px 4px;font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:var(--r);font-size:12px}
.keys{position:fixed;inset:0;z-index:55;background:rgba(8,12,18,.35);display:grid;place-items:center;padding:16px}
.keys .w{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:280px;font-size:12px}
.keys dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:10px 0 0}

  .bar{padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px))}

<body>
<div class="gate" id="gate">
  <form id="gateForm" autocomplete="on">
    <div class="mark"><b><svg class="i" viewBox="0 0 16 16" style="stroke:#fff;width:12px;height:12px"><path d="M3 11l3-3 2 2 4-5"/></svg></b>법인영업 레이더</div>
    <label class="f" for="gId">아이디<input type="text" id="gId" name="username" autocomplete="username" required></label>
    <label class="f" for="gPw">비밀번호<input type="password" id="gPw" autocomplete="current-password" placeholder="xxxx-xxxx-xxxx-xxxx" required></label>

  </form>
</div>

<div class="app" id="app" hidden>
  <aside class="side">

    <button class="find" id="findBtn" type="button" aria-label="법인 찾기"><svg class="i" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg><span>법인 찾기</span><kbd>Ctrl K</kbd></button>

      <button class="ib" id="themeBtn" title="밝게/어둡게" type="button"><svg class="i" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5a5.5 5.5 0 0 1 0 11z" fill="currentColor"/></svg></button>
      <button class="ib" id="lockBtn" title="로그아웃 (이 기기의 로그인 정보 삭제)" type="button"><svg class="i" viewBox="0 0 16 16"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg></button>
    </div>

<div class="pal" id="pal" hidden><div class="w"><input id="palQ" placeholder="법인명, 종목코드, 사업자번호 또는 메뉴" autocomplete="off"><div class="rs" id="palR"></div></div></div>
<div class="keys" id="keys" hidden><div class="w"><b>단축키</b><dl>
  <dt><kbd>Ctrl</kbd> <kbd>K</kbd> · <kbd>/</kbd></dt><dd>법인 찾기</dd>
  <dt><kbd>J</kbd> <kbd>K</kbd></dt><dd>목록 아래·위</dd>

  <dt><kbd>Esc</kbd></dt><dd>닫기</dd></dl></div></div>

<script>
"use strict";
(() => {
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eok = n => n == null || n === "" ? "–" : `${Math.round(n / 1e8).toLocaleString("ko-KR")}억`;
const won = n => Math.abs(n) >= 1e8 ? `${(n / 1e8).toLocaleString("ko-KR", {maximumFractionDigits: 2})}억원` : `${Math.round(n / 1e4).toLocaleString("ko-KR")}만원`;
const ymd = d => d ? d.replaceAll("-", ".") : "";
const md = d => d ? `${+d.slice(5, 7)}/${+d.slice(8, 10)}` : "";
const iso = x => `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`;
const addDays = (d, n) => { const x = new Date(d + "T00:00:00"); x.setDate(x.getDate() + n); return iso(x); };
const TODAY = iso(new Date());
const dday = d => d ? Math.round((new Date(d + "T00:00:00") - new Date(TODAY + "T00:00:00")) / 864e5) : null;
const MK = {Y: "유가", K: "코스닥", N: "코넥스", E: "비상장"};
const debounce = (f, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => f(...a), ms); }; };
const store = {get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e) { return d; } },
               set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e) { return false; } }};
function toast(m) { const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.append(t); setTimeout(() => t.remove(), 1700); }
async function copy(txt, msg) {
  try { await navigator.clipboard.writeText(txt); }
  catch(e) { const ta = document.createElement("textarea"); ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.append(ta); ta.select(); try { document.execCommand("copy"); } catch(_) {} ta.remove(); }
  toast(msg || "복사했습니다");
}
function download(name, text, type) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name;
  document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
const I = {
  inbox: '<svg class="i" viewBox="0 0 16 16"><path d="M2 9l1.6-5.2A1 1 0 0 1 4.6 3h6.8a1 1 0 0 1 1 .8L14 9v3.5a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z"/><path d="M2 9h3.5l1 1.5h3l1-1.5H14"/></svg>',
  cal: '<svg class="i" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="11" rx="1.5"/><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3"/></svg>',
  bars: '<svg class="i" viewBox="0 0 16 16"><path d="M2.5 13.5h11M4 11V7M8 11V3.5M12 11V8.5"/></svg>',
  bldg: '<svg class="i" viewBox="0 0 16 16"><path d="M3 14V3.5a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1V14M10 6.5h2a1 1 0 0 1 1 1V14M1.5 14h13M5.5 5h2M5.5 8h2M5.5 11h2"/></svg>',
  pbr: '<svg class="i" viewBox="0 0 16 16"><path d="M2 13.5l4-4 2.5 2.5L14 6"/><path d="M10.5 6H14v3.5"/></svg>',
  pct: '<svg class="i" viewBox="0 0 16 16"><path d="M12.5 3.5l-9 9"/><circle cx="4.5" cy="4.5" r="1.8"/><circle cx="11.5" cy="11.5" r="1.8"/></svg>',
  pipe: '<svg class="i" viewBox="0 0 16 16"><rect x="2" y="2.5" width="3.5" height="11" rx="1"/><rect x="6.5" y="2.5" width="3.5" height="7" rx="1"/><rect x="11" y="2.5" width="3" height="4.5" rx="1"/></svg>',
  dl: '<svg class="i" viewBox="0 0 16 16"><path d="M8 2.5v8M4.5 7.5L8 11l3.5-3.5M3 13.5h10"/></svg>',
  copy: '<svg class="i" viewBox="0 0 16 16"><rect x="5" y="5" width="8.5" height="8.5" rx="1.5"/><path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-6A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5"/></svg>',
  ext: '<svg class="i" viewBox="0 0 16 16"><path d="M9 2.5h4.5V7M13.5 2.5L7.5 8.5M12 9.5v3a1 1 0 0 1-1 1H3.5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3"/></svg>',
  mail: '<svg class="i" viewBox="0 0 16 16"><rect x="2" y="3.5" width="12" height="9" rx="1.5"/><path d="M2.5 4.5L8 9l5.5-4.5"/></svg>',
  back: '<svg class="i" viewBox="0 0 16 16"><path d="M10 3L5 8l5 5"/></svg>',
  x: '<svg class="i" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg>',
  prn: '<svg class="i" viewBox="0 0 16 16"><path d="M4.5 6V2.5h7V6M4.5 11.5h-2v-5h11v5h-2M4.5 9.5h7v4h-7z"/></svg>',
  up: '<svg class="i" viewBox="0 0 16 16"><path d="M8 13.5v-8M4.5 8.5L8 5l3.5 3.5M3 2.5h10"/></svg>',
  chev: d => `<svg class="i" viewBox="0 0 16 16"><path d="${d < 0 ? "M10 3L5 8l5 5" : "M6 3l5 5-5 5"}"/></svg>`,
};

/* ───────── 신호 사전 ───────── */
const T = {
  FUND: {n: "자금조달", c: "var(--c-fund)"}, BB_END: {n: "신탁 해지", c: "var(--c-bb)"}, BB_DIRECT: {n: "자사주 직접취득", c: "var(--c-bb)"},
  BB_EXPIRY: {n: "신탁 만기", c: "var(--c-bb)"}, PLEDGE: {n: "주식담보 만기", c: "var(--c-pl)"}, UL_CASH: {n: "여유자금", c: "var(--c-ul)"},
  UL_DC: {n: "퇴직연금 DC", c: "var(--c-ul)"}, UL_FX: {n: "외화자금", c: "var(--c-ul)"}, LOWPBR: {n: "저PBR", c: "var(--c-lp)"},
};
const STAGE = {new: "납입 전", due: "납입 임박", paid: "납입 완료"};
const ACTION = new Set(["FUND", "BB_END", "BB_DIRECT", "BB_EXPIRY", "PLEDGE"]);
const sgn = s => `<span class="sg" style="--c:${T[s.t].c}"><b>${esc(T[s.t].n)}</b>${s.st ? esc(STAGE[s.st]) : ""}</span>`;
function ddTag(s) {
  const d = dday(s.d); if (d == null) return "";
  if (s.t === "BB_END" || s.t === "BB_DIRECT") return `<span class="dd past num">${d === 0 ? "오늘" : -d + "일 전"}</span>`;
  if ((s.t === "PLEDGE" || s.t === "BB_EXPIRY") && d < 0) return `<span class="dd past num">경과 ${-d}일</span>`;
  const txt = d === 0 ? "D-day" : d > 0 ? `D-${d}` : `D+${-d}`;
  return `<span class="dd num ${d >= -3 && d <= 7 ? "hot" : d >= -30 && d <= 30 ? "warm" : ""}">${txt}</span>`;
}
function fig(s) {   // 핵심 수치 한 칸
  switch (s.t) {
    case "FUND": return `${esc(s.kind)} <b class="num">${eok(s.amt)}</b>`;
    case "BB_EXPIRY": return `<b class="num">${eok(s.amt)}</b> · ${esc(s.inst || "수탁사 미상")}`;
    case "PLEDGE": return `${esc(s.holder)} · ${esc(s.lender)} <b class="num">${eok(s.amt)}</b>${s.rate ? ` <span class="mute num">${s.rate}%</span>` : ""}`;
    case "BB_END": case "BB_DIRECT": return esc(title(s));
    case "UL_CASH": return `<b class="num">${eok(s.amt)}</b> 현금성`;
    case "UL_DC": return esc(s.pension);
    case "UL_FX": return `<b class="num">${eok(s.amt)}</b> 외화`;
    case "LOWPBR": return `PBR <b class="num">${s.pbr}</b>`;
  }
  return "";
}
const title = s => (s.title || "").replace(/^\[.*?\]/, "").replace("주요사항보고서", "").replace(/^\(|\)$/g, "");

/* ───────── 멘트·메일 (수익 보장·확정 표현 금지) ───────── */
function talk(s, c) {
  const nm = c.n, ours = D.our_firm;
  switch (s.t) {
    case "FUND":
      if (s.st === "new") return `${nm} ${s.kind} ${eok(s.amt)} 결정 공시를 보고 연락드렸습니다.\n${s.d ? `납입(${ymd(s.d)}) 이후 ` : ""}실제 집행까지 대기하는 자금 운용 계획을 여쭙고 싶습니다.\n하루 단위로도 맡길 수 있는 RP·발행어음·MMW의 금리와 만기 구조를 비교해 드리겠습니다.`;
      if (s.st === "due") return `${nm} ${s.kind} 납입일(${ymd(s.d)})이 다가와 연락드렸습니다.\n납입 후 집행까지 기간을 알려주시면 그 기간에 맞춘 RP·발행어음 만기 구성안을 오늘 중 보내드리겠습니다.`;
      return `${nm} ${s.kind} 납입(${ymd(s.d)})이 끝난 것으로 확인됩니다.\n집행 일정에 맞춰 구간별로 나눠 운용하는 방안(수시 RP와 기간물 발행어음)을 제안드리고 싶습니다.`;
    case "BB_END": return `${nm} 자기주식취득 신탁계약 해지 공시를 확인했습니다.\n추가 매입 계획이 있으시면 재계약 조건(수수료, 매입 방식, 기간)을 비교하실 수 있도록 ${ours} 안을 드리겠습니다.`;
    case "BB_DIRECT": return `${nm} 자기주식 직접취득 결정을 확인했습니다.\n신탁 방식은 매매 실무를 위탁하고 취득 기간을 유연하게 가져갈 수 있어, 다음 매입부터 비교해 보실 수 있게 자료를 드리겠습니다.`;
    case "BB_EXPIRY": return s.ours
      ? `${nm} 자사주신탁(${ours}) 만기가 ${ymd(s.d)}입니다.\n연장이나 재계약 여부와 남은 매입 계획을 미리 협의드리고자 합니다.`
      : `${nm}의 ${s.inst || "타사"} 자사주신탁 만기가 ${ymd(s.d)}입니다.\n재계약을 검토하시면 ${ours} 조건을 함께 비교하실 수 있도록 제안서를 드리겠습니다.`;
    case "PLEDGE": return s.ours
      ? `${s.holder}님(${nm}) 주식담보대출(${ours}) 만기가 ${ymd(s.d)}입니다.\n연장 조건을 미리 안내드리고자 합니다.`
      : `${s.holder}님(${nm}) 주식담보대출(${s.lender}, ${eok(s.amt)}${s.rate ? `, ${s.rate}%` : ""}) 만기가 ${ymd(s.d)}입니다.\n차환을 검토하시면 ${ours} 조건(금리, 담보유지비율, 기간)을 비교해 드리겠습니다.`;
    case "UL_CASH": return `${nm} 감사보고서상 현금성자산이 ${eok(s.amt)} 수준으로 확인됩니다.\n예금 외에 RP·발행어음 같은 단기 운용 수단의 금리를 비교해 드리고 싶습니다.${s.pension && /DB만|미가입/.test(s.pension) ? `\n퇴직연금(현재 ${s.pension}) DC 제도 안내도 함께 가능합니다.` : ""}`;
    case "UL_DC": return `${nm}은(는) 감사보고서상 퇴직연금이 ${s.pension}으로 파악됩니다.\nDC 도입이나 전환을 검토하시면 ${ours} 퇴직연금 담당 부서를 연결해 드리겠습니다.`;
    case "UL_FX": return `${nm}은(는) 외화 현금 약 ${eok(s.amt)}을 보유하신 것으로 확인됩니다.\n외화예금과 외화RP의 금리, 만기 구조를 비교해 안내드리고자 합니다.`;
    case "LOWPBR": return `${nm}은(는) PBR ${s.pbr}배로, 발행주식 10%를 매입하면 BPS가 약 ${s.bps10}% 개선되는 구조입니다(산식 기준).\n주주환원 차원에서 자사주신탁 활용 방안을 설명드리고 싶습니다.`;
  }
  return "";
}
function mail(s, c) {
  const subj = {FUND: `${c.n} 조달자금 단기 운용 제안`, BB_END: `${c.n} 자사주신탁 재계약 비교 제안`, BB_DIRECT: `${c.n} 자사주 취득 신탁 방식 비교 자료`,
    BB_EXPIRY: `${c.n} 자사주신탁 만기 관련 안내`, PLEDGE: `주식담보대출 차환 조건 안내`, UL_CASH: `${c.n} 단기 여유자금 운용 안내`,
    UL_DC: `퇴직연금 DC 제도 안내`, UL_FX: `외화RP 운용 안내`, LOWPBR: `자사주신탁을 통한 주주환원 방안`}[s.t];

const enc = new TextEncoder();
const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function sha256hex(t) { const h = await crypto.subtle.digest("SHA-256", enc.encode(t)); return [...new Uint8Array(h)].map(x => x.toString(16).padStart(2, "0")).join(""); }

async function deriveKek(pw, salt, iter) {
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name: "PBKDF2", salt, iterations: iter, hash: "SHA-256"}, base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
}
async function openData(buf, keys, h, kek) {
  const ent = keys.users[h]; if (!ent) throw new Error("no-user");
  const w = fromB64(ent.w);
  const raw = await crypto.subtle.decrypt({name: "AES-GCM", iv: w.slice(0, 12)}, kek, w.slice(12));
  const k = await crypto.subtle.importKey("raw", raw, {name: "AES-GCM"}, false, ["decrypt"]);
  const b = new Uint8Array(buf);
  if (String.fromCharCode(...b.slice(0, 4)) !== "WMR1") throw new Error("bad-file");
  const plain = await crypto.subtle.decrypt({name: "AES-GCM", iv: b.slice(4, 16)}, k, b.slice(16));
  return new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).json();
}
// 로그인 유지: 비밀번호가 아니라 추출할 수 없는 CryptoKey 를 IndexedDB 에 둔다
const idb = () => new Promise((ok, no) => { const r = indexedDB.open("wmr", 1); r.onupgradeneeded = () => r.result.createObjectStore("k"); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });

  try { const db = await idb(); return await new Promise((ok, no) => { const tx = db.transaction("k", op === "get" ? "readonly" : "readwrite"), st = tx.objectStore("k");

  catch(e) { return null; }
}

async function boot() {
  let buf, keys;

    const [r1, r2] = await Promise.all([fetch(`data/data.enc?t=${Date.now()}`, {cache: "no-store"}), fetch(`data/keys.json?t=${Date.now()}`, {cache: "no-store"})]);
    if (!r1.ok || !r2.ok) throw new Error(`HTTP ${r1.status}/${r2.status}`);
    buf = await r1.arrayBuffer(); keys = await r2.json();
  } catch(e) { $("#gErr").textContent = `데이터를 불러오지 못했습니다 (${e.message}). 네트워크를 확인하고 새로고침하세요.`; return; }
  const saved = await kv("get", "me");

    catch(e) { await kv("del", "me"); }   // 계정이 삭제·재발급되면 저장된 키는 더 맞지 않는다
  }

    <textarea id="dMemo" placeholder="통화 내용, 상대 담당자, 다음 할 일" aria-label="메모">${esc(p.memo || "")}</textarea></div></div>
  <div class="dsec"><h3>신호 <span class="num">${ss.length}</span></h3>
    ${ss.map((s, i) => `<div class="sig"><div class="h">${sgn(s)}${s.ours ? '<span class="pill ok">자사 계약</span>' : ""}${NEW.has(s.id) ? '<span class="pill ac">신규</span>' : ""}${ddTag(s)}<span class="sc num" title="${esc((s.why || []).join("\n"))}">우선 ${s.sc}</span></div>
      ${kvs(s)}${fundCalc(s)}<div class="talk">${esc(talk(s, c))}</div>
      <div class="acts"><button class="btn" data-copy="${i}">${I.copy}멘트 복사</button><button class="btn" data-mail="${i}">${I.mail}메일 초안</button>
        ${s.d && ACTION.has(s.t) && dday(s.d) >= 0 ? `<button class="btn" data-ics="${i}">${I.cal}캘린더</button>` : ""}
        ${s.src ? `<a class="btn" href="${esc(D.dart_url.replace("%s", s.src))}" target="_blank" rel="noopener noreferrer">${I.ext}DART 원문</a>` : ""}</div>
      <div class="why">${esc((s.why || []).join(" · "))}</div></div>`).join("")}</div>
  ${tl.length > 1 ? `<div class="dsec"><h3>타임라인</h3><ul class="tl">${tl.map(({d, s}) => `<li><span class="num">${ymd(d)}</span><span>${esc(T[s.t].n)}${s.st ? " · " + esc(STAGE[s.st]) : ""}${s.amt ? " · " + eok(s.amt) : ""}</span></li>`).join("")}</ul></div>` : ""}
  <div class="notice">숫자는 공시와 감사보고서 원문에서 자동으로 읽은 값입니다. 고객에게 말하기 전에 DART 원문을 확인하세요. 투자권유 시 적합성·설명의무 절차를 따르고, 수익을 보장하는 표현은 쓰지 마세요. 대주주 개인 정보는 영업 목적 외로 쓰지 마세요.</div>`;
  el.scrollTop = 0;
  const save = () => { const st = $("#dSt").value, next = $("#dNext").value, memo = $("#dMemo").value;
    if (!st && !next && !memo.trim()) delete PIPE[cc]; else PIPE[cc] = {st, next, memo, at: new Date().toISOString()};
    savePipe(); const s = $("#dSaved"); s.textContent = "저장됨"; setTimeout(() => { if (s.isConnected) s.textContent = ""; }, 1200);
    renderNav(); refreshRow(cc); };
  $("#dSt").onchange = save; $("#dNext").onchange = save; $("#dMemo").oninput = debounce(save, 600);
  $$("[data-nx]").forEach(b => b.onclick = () => { $("#dNext").value = addDays(TODAY, +b.dataset.nx); save(); });
  $("#dStar").onclick = () => toggleStar(cc);
  $("#dClose").onclick = () => go(view); $("#dBack").onclick = () => go(view);
  $$("[data-cp]").forEach(b => b.onclick = () => copy(b.dataset.cp));
  $$("[data-copy]").forEach(b => b.onclick = () => copy(talk(ss[+b.dataset.copy], c), "멘트를 복사했습니다"));
  $$("[data-mail]").forEach(b => b.onclick = () => { const m = mail(ss[+b.dataset.mail], c); copy(`제목: ${m.subj}\n\n${m.body}`, "메일 초안을 복사했습니다"); });
  $$("[data-ics]").forEach(b => b.onclick = () => { const s = ss[+b.dataset.ics]; ics(`${c.n}_${T[s.t].n}`, [s]); });
}
function refreshRow(cc) {
  if (!["today", "listed", "unlisted", "lowpbr"].includes(view)) { if (view === "pipe") renderView(); return; }
  $$(`#pane tr[data-cc="${CSS.escape(cc)}"]`).forEach(tr => { const td = tr.lastElementChild; if (td) td.innerHTML = pipeCell({cc}); });
}
function toggleStar(cc) {
  STAR.has(cc) ? STAR.delete(cc) : STAR.add(cc); saveStar(); renderDetail(); renderNav();
  if (view === "pipe") renderView(); else $$(`#pane tr[data-cc="${CSS.escape(cc)}"] td.nm`).forEach(td => { const r = (BY[cc] || [])[0] || {cc}; td.innerHTML = nameCell({...r, cc}); });
  toast(STAR.has(cc) ? "관심 법인에 추가했습니다" : "관심 법인에서 뺐습니다");
}

/* ───────── 명령 팔레트 ───────── */
let NAMES = null, palIdx = 0, palItems = [];
function openPal() { $("#pal").hidden = false; $("#palQ").value = ""; palRender(""); $("#palQ").focus(); }
function closePal() { $("#pal").hidden = true; }
function palRender(q) {
  NAMES ||= Object.values(D.corps).map(c => ({cc: c.cc, n: c.n || "", sc: c.sc || "", bz: (c.bz || "").replaceAll("-", ""), top: c.top || 0}));
  const qq = q.trim().replaceAll("-", "");
  const corps = qq ? NAMES.filter(x => x.n.includes(qq) || x.sc === qq || (qq.length >= 5 && x.bz.startsWith(qq))).sort((a, b) => (b.n.startsWith(qq) - a.n.startsWith(qq)) || b.top - a.top).slice(0, 10)
    : [...STAR].filter(cc => D.corps[cc]).slice(0, 6).map(cc => NAMES.find(x => x.cc === cc));
  const views = VIEWS.filter(([, l]) => !qq || l.includes(qq));
  palItems = [...corps.map(x => ({k: "c", v: x.cc, h: `<span>${esc(x.n)}</span><span class="k">${tagsOf(x.cc).slice(0, 3).map(t => T[t].n).join(" · ")}</span>`})),
    ...views.map(([k, l, ic]) => ({k: "v", v: k, h: `${ic}<span>${l}</span><span class="k"><kbd>${VIEWS.findIndex(v => v[0] === k) + 1}</kbd></span>`}))];
  palIdx = 0;
  $("#palR").innerHTML = (corps.length ? `<div class="gh">${qq ? "법인" : "관심 법인"}</div>` : "") + palItems.filter(x => x.k === "c").map((x, i) => `<div class="it ${i === 0 ? "on" : ""}" data-i="${i}">${x.h}</div>`).join("")
    + (views.length ? '<div class="gh">메뉴</div>' : "") + palItems.filter(x => x.k === "v").map((x, j) => { const i = corps.length + j; return `<div class="it ${i === 0 ? "on" : ""}" data-i="${i}">${x.h}</div>`; }).join("")
    + (!palItems.length ? '<div class="empty" style="padding:20px">찾는 법인이 없습니다</div>' : "");
  $$("#palR .it").forEach(d => d.onclick = () => palGo(+d.dataset.i));
}
function palGo(i) { const it = palItems[i]; if (!it) return; closePal(); if (it.k === "c") go(["cal", "market"].includes(view) ? "today" : view, it.v); else go(it.v); }
$("#palQ").addEventListener("input", e => palRender(e.target.value));
$("#palQ").addEventListener("keydown", e => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); if (!palItems.length) return; palIdx = (palIdx + (e.key === "ArrowDown" ? 1 : -1) + palItems.length) % palItems.length;
    $$("#palR .it").forEach(d => d.classList.toggle("on", +d.dataset.i === palIdx)); $(`#palR .it[data-i="${palIdx}"]`)?.scrollIntoView({block: "nearest"}); }
  if (e.key === "Enter") palGo(palIdx);
  if (e.key === "Escape") closePal();
});
$("#pal").addEventListener("click", e => { if (e.target.id === "pal") closePal(); });
$("#findBtn").onclick = openPal;

/* ───────── 키보드 ───────── */
document.addEventListener("keydown", e => {
  if (!D) return;
  const typing = e.target.closest("input,textarea,select");
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openPal(); return; }
  if (e.key === "Escape") { if (!$("#keys").hidden) $("#keys").hidden = true; else if (!$("#pal").hidden) closePal(); else if (SEL && !typing) go(view); return; }
  if (typing || e.ctrlKey || e.metaKey || e.altKey || !$("#pal").hidden) return;
  if (e.key === "/") { e.preventDefault(); openPal(); }
  else if (e.key === "?") $("#keys").hidden = !$("#keys").hidden;
  else if (/^[1-7]$/.test(e.key)) go(VIEWS[+e.key - 1][0]);
  else if (e.key === "j" || e.key === "k") {
    const ids = [...new Set($$("#pane tbody tr[data-cc]").map(tr => tr.dataset.cc))]; if (!ids.length) return;
    e.preventDefault(); const i = ids.indexOf(SEL), n = i < 0 ? 0 : e.key === "j" ? Math.min(ids.length - 1, i + 1) : Math.max(0, i - 1);
    select(ids[n]); requestAnimationFrame(() => $(`#pane tr[data-cc="${CSS.escape(ids[n])}"]`)?.scrollIntoView({block: "nearest"})); }
  else if (e.key === "s" && SEL) toggleStar(SEL);
  else if (e.key === "c" && SEL) { const s = (BY[SEL] || [])[0]; if (s) copy(talk(s, D.corps[SEL]), "멘트를 복사했습니다"); }
});
$("#keysBtn").onclick = () => $("#keys").hidden = false;
$("#keys").addEventListener("click", e => { if (e.target.id === "keys") $("#keys").hidden = true; });

/* ───────── 테마·로그아웃 ───────── */
try { const t = localStorage.getItem("wmr-theme"); if (t) document.documentElement.dataset.theme = t; } catch(e) {}
$("#themeBtn").onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"), nx = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = nx; try { localStorage.setItem("wmr-theme", nx); } catch(e) {}
  if (view === "market") drawChart();
};
$("#lockBtn").onclick = async () => { await kv("del", "me"); location.hash = ""; location.reload(); };

boot();
})();
</script>
</body>
</html>
